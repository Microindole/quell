name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.25.7
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run quality checks
        run: go run ./scripts/check --mode quality

  build-windows:
    needs: preflight
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: go1.25.7
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Standard Version
        run: |
          wails build -platform windows/amd64 -ldflags "-s -w"
          mv build/bin/quell.exe build/bin/quell_standard.exe

      - name: Download FFmpeg for Bundled Version
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
          Copy-Item "ffmpeg_temp/*/bin/ffmpeg.exe" -Destination "internal/engine/ffmpeg.exe"

      - name: Build Bundled Version
        run: |
          wails build -platform windows/amd64 -tags bundled -ldflags "-s -w"
          mv build/bin/quell.exe build/bin/quell_with_ffmpeg.exe

      - name: Generate checksums
        shell: pwsh
        run: |
          $items = @(
            "build/bin/quell_standard.exe",
            "build/bin/quell_with_ffmpeg.exe"
          )
          $lines = foreach ($item in $items) {
            $hash = (Get-FileHash -Path $item -Algorithm SHA256).Hash.ToLower()
            "$hash  $item"
          }
          $lines | Set-Content build/bin/SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/quell_standard.exe
            build/bin/quell_with_ffmpeg.exe
            build/bin/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
