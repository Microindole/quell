name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Standard Version
        run: |
          wails build -platform windows/amd64 -ldflags "-s -w"
          mv build/bin/quell.exe build/bin/quell_standard.exe

      - name: Download FFmpeg for Bundled Version
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
          Copy-Item "ffmpeg_temp/*/bin/ffmpeg.exe" -Destination "internal/engine/ffmpeg.exe"

      - name: Build Bundled Version
        run: |
          wails build -platform windows/amd64 -tags bundled -ldflags "-s -w"
          mv build/bin/quell.exe build/bin/quell_with_ffmpeg.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/quell_standard.exe
            build/bin/quell_with_ffmpeg.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
