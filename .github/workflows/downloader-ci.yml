name: Downloader CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
    paths:
      - "internal/downloader/**"
      - "internal/crawler/**"
      - "internal/dynamic/**"
      - "internal/domain/**"
  pull_request:
    paths:
      - "internal/downloader/**"
      - "internal/crawler/**"
      - "internal/dynamic/**"
      - "internal/domain/**"
  workflow_dispatch:

concurrency:
  group: downloader-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  downloader-check:
    name: Downloader Checks
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.25.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run baseline checks
        run: go run ./scripts/check --mode quick

      - name: Run downloader package tests
        run: go test ./internal/downloader/... ./internal/crawler/... ./internal/domain/...

      - name: Build all packages
        run: go build ./...

      - name: Run security checks
        run: go run ./scripts/check --mode security --gosec-sarif .reports/gosec.sarif

      - name: Upload SARIF report
        if: always() && hashFiles('.reports/gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .reports/gosec.sarif
